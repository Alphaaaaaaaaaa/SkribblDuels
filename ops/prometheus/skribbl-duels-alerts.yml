groups:
  - name: skribbl-duels-gateway
    rules:
      - alert: SkribblDuelsGatewayNotReady
        expr: min_over_time(skribbl_duels_gateway_ready[2m]) < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Skribbl Duels Gateway is not ready
          description: Supabase, Redis or the fenced Match Authority has been unhealthy for at least two minutes.
      - alert: SkribblDuelsRealtimeUnavailable
        expr: min_over_time(skribbl_duels_gateway_realtime_healthy[2m]) < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Skribbl Duels shared realtime is unavailable
          description: The Redis Streams adapter or Authority leader is unavailable.
      - alert: SkribblDuelsTransportErrorBurst
        expr: sum(rate(skribbl_duels_gateway_transport_errors_total[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Skribbl Duels transport errors are elevated
          description: Socket.IO is reporting a sustained Engine.IO transport error rate.
      - alert: SkribblDuelsMatchAbortBurst
        expr: sum(rate(skribbl_duels_gateway_match_aborts_total[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Skribbl Duels match aborts are elevated
          description: Authoritative match cancellations exceed the expected baseline.
